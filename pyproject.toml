[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "council-works-radar"
version = "0.1.0"
description = "Pre-tender capital-works intelligence for WA civil contractors (council documents only)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "pymupdf==2.1",
    "pypdf==6.21.4",
    "pyyaml==6.0.3",
    "jinja2==3.1.6",
    "rapidfuzz==3.14.6",
]

[project.optional-dependencies]
pdf = ["weasyprint==70.0"]
dev = ["pytest==9.2.0"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
"radar" = ["templates/*", "ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
